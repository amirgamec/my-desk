# Optional: builds GlassDesktop.exe on GitHub for free every time you publish a Release.
# Release tag must be v + APP_VERSION from main.py (example: APP_VERSION = "1.0.8"  ->  tag v1.0.8).
name: Build Windows exe
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip pyinstaller PySide6 qtawesome jdatetime
      - name: Check version matches tag
        shell: python
        run: |
          import re, sys, os
          ver = re.search(r'APP_VERSION = "([^"]+)"', open("main.py", encoding="utf-8").read()).group(1)
          tag = os.environ["TAG"]
          if tag.lstrip("v") != ver:
              sys.exit(f"APP_VERSION is {ver} but the release tag is {tag}")
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Build exe
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path assets) { $extra += @("--add-data", "assets;assets") }
          if (Test-Path assets\icon.ico) { $extra += @("--icon", "assets\icon.ico") }
          pyinstaller --noconfirm --clean --onefile --windowed --name GlassDesktop --collect-all qtawesome @extra main.py
      - name: Write version.json
        shell: python
        run: |
          import hashlib, json, os, pathlib
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          main = pathlib.Path("main.py").read_bytes().replace(b"\r\n", b"\n")
          exe = pathlib.Path("dist/GlassDesktop.exe").read_bytes()
          info = {
              "version": tag.lstrip("v"),
              "url": f"https://raw.githubusercontent.com/{repo}/{tag}/main.py",
              "sha256": hashlib.sha256(main).hexdigest(),
              "exe_url": f"https://github.com/{repo}/releases/download/{tag}/GlassDesktop.exe",
              "exe_sha256": hashlib.sha256(exe).hexdigest(),
              "page": f"https://github.com/{repo}/releases/tag/{tag}",
          }
          pathlib.Path("version.json").write_text(json.dumps(info, indent=2))
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
      - name: Upload to the release
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" dist/GlassDesktop.exe version.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
